<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#09090b" />
    <!-- favicon -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" type="image/x-icon" />
    <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
    <!-- FireFox -->
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <title>Tantan</title>
    <meta
      name="description"
      content="Tantan 是本地优先的 RSS 阅读器，通过每日推荐、Topic 和你自己的 AI Provider 整理订阅内容。"
    />
    <meta name="keywords" content="RSS 阅读器, 每日推荐, Topic, 本地优先, AI 筛选, Web, PWA" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="language" content="zh-CN" />

    <!-- Apple Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tantan" />

    <!-- OpenGraph Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tantan" />
    <meta property="og:title" content="Tantan" />
    <meta property="og:description" content="本地优先的 RSS 每日推荐、Topic 与 AI 筛选。" />
    <meta property="og:locale" content="zh_CN" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Tantan",
        "description": "Local-first RSS recommendations, topics and filtering.",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <!-- FOLLOW VITE BUILD INJECT -->
    <!-- Check Browser Script Inject -->

    <script>
      document.documentElement.dataset.theme = "dark"
      // Can not get window.electron so check userAgent
      const isElectron = navigator.userAgent.includes("Electron")
      document.documentElement.dataset.buildType = isElectron ? "electron" : "web"
    </script>
    <script>
      const isMobile = window.innerWidth < 1024
      document.documentElement.dataset.viewport = isMobile ? "mobile" : "desktop"
    </script>
  </head>
  <body>
    <div id="root"></div>

    <div id="app-skeleton" class="drag-region">
      <!-- Skeleton -->
      <style>
        [data-build-type]:not([data-build-type="electron"]) #root {
          background-color: hsl(var(--background));
        }
        [data-build-type="web"] #app-skeleton .sidebar {
          display: none;
        }
        html,
        body {
          height: 100%;
          width: 100%;
          margin: 0;
          padding: 0;
        }
        #app-skeleton {
          position: fixed;
          inset: 0;
          z-index: 1000;
        }
        [data-viewport="mobile"] #app-skeleton {
          display: none;
        }
        [data-theme="light"] {
          --background: 0 0% 100%;
        }

        [data-theme="dark"] {
          --background: 0 0% 7.1%;
        }
        .skeleton {
          display: flex;
          height: 100%;
          width: 100%;
        }

        .sidebar {
          width: 16rem;
          flex-shrink: 0;
          height: 100%;
          background-color: hsl(var(--fo-sidebar));
        }
        [data-build-type="electron"] .sidebar {
          background-color: hsl(var(--fo-sidebar) / 0.3);
        }
        [data-build-type="electron"][data-theme="dark"] .sidebar {
          background-color: hsl(var(--fo-sidebar) / 0.1);
        }
        .content {
          flex-grow: 1;
          width: 100%;
          height: 100%;
          background-color: hsl(var(--background));
        }

        [data-theme="light"] {
          --fo-sidebar: 240 1.6% 87.6%;
        }
        [data-theme="dark"] {
          --fo-sidebar: 30 1.7% 23.5%;
        }

        [data-build-type="web"] {
          --fo-sidebar: 240 4.8% 95.9%;
        }

        [data-build-type="web"][data-theme="dark"] {
          --fo-sidebar: 220 8.1% 14.5%;
        }
      </style>
      <div class="skeleton">
        <div class="sidebar"></div>
        <div class="content"></div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
